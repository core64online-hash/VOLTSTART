name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm піднімаємо через Corepack (вбудований у Node), а не через
      # сторонній pnpm/action-setup — щоб CI працював навіть за суворої
      # політики allow-list у Settings → Actions (лише GitHub-авторські
      # actions/checkout та actions/setup-node). Версія pnpm береться з
      # поля "packageManager" у package.json.
      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @voltstar/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Лише збірка (без публікації): ловимо поломки Dockerfile до мержу.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t voltstar-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_SITE_URL=https://voltstar.example -t voltstar-web:ci .

      - name: Validate production compose
        run: |
          POSTGRES_PASSWORD=x JWT_SECRET=x INTERNAL_API_TOKEN=x TYPESENSE_API_KEY=x SITE_URL=https://voltstar.example \
            docker compose -f docker-compose.prod.yml config --quiet

      # Coolify зчитує вкладені підстановки (${A:-${B}}) і текст після `:?` як значення змінних
      # (напр. назва образу ставала «voltstar-api:${SOURCE_COMMIT:-dev}») — у compose їх бути не має.
      - name: Compose is Coolify-safe
        run: |
          if grep -nE '\$\{[A-Za-z_]+:[-?][^}]*\$\{|\$\{[A-Za-z_]+:\?[^}]+\}' docker-compose.prod.yml | grep -vE '^[0-9]+:[[:space:]]*#'; then
            echo "::error::docker-compose.prod.yml: вкладена підстановка або текст після :?"; exit 1
          fi

      # Власні образи ніде не публікуються — кожен сервіс, що їх використовує, мусить мати `build`,
      # інакше `compose pull --ignore-buildable` (Coolify, перед деплоєм) шукає їх у Docker Hub.
      - name: Own images are buildable
        run: |
          POSTGRES_PASSWORD=x JWT_SECRET=x INTERNAL_API_TOKEN=x TYPESENSE_API_KEY=x SITE_URL=https://voltstar.example \
            docker compose -f docker-compose.prod.yml config --format json \
            | jq -e '[.services | to_entries[] | select((.value.image // "") | startswith("voltstar-")) | select(.value.build == null) | .key]
                     | if length > 0 then error("без build: \(join(", "))") else true end'

